<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jubber UI</title>
  <link rel="stylesheet" href="jubber.css">
  <style>
    body { min-height: 100vh; margin: 0; color: #f5ffe8; background: radial-gradient(circle at 50% 30%, #283d19, #091009 65%); font-family: system-ui, sans-serif; }
    main { width: min(760px, calc(100% - 40px)); margin: 0 auto; padding: 12vh 0; }
    h1 { font-size: clamp(42px, 8vw, 86px); line-height: .9; margin: 0 0 24px; }
    p { max-width: 56ch; color: #bdd0b2; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>Meet Jubber.</h1>
    <p>Move your pointer toward him, then hover or click. This standalone page contains the same baseline UI used on the live sites.</p>
  </main>

  <button class="jubber-ui" data-jubber type="button" aria-label="Open Jubber assistant" aria-haspopup="dialog" aria-controls="jubber-chat">
    <span class="jubber-ui__motion" aria-hidden="true">
      <span class="jubber-ui__glow"></span>
      <img class="jubber-ui__visual" src="assets/jubber.webp" alt="" width="160" height="160" draggable="false">
    </span>
    <span class="jubber-ui__tip">I'm Jubber · Click me</span>
  </button>


  <dialog class="jubber-chat" id="jubber-chat" data-jubber-chat aria-labelledby="jubber-chat-title">
    <div class="jubber-chat__shell">
      <header class="jubber-chat__head">
        <div class="jubber-chat__title" id="jubber-chat-title">Jubber</div>
        <button class="jubber-chat__close" data-jubber-chat-close type="button" aria-label="Close Jubber chat">Close</button>
      </header>
      <div class="jubber-chat__log" data-jubber-chat-log aria-live="polite">
        <div class="jubber-chat__message jubber-chat__message--jubber">Hey, I'm Jubber. Ask me anything—or close this and throw me around.</div>
      </div>
      <form class="jubber-chat__composer">
        <input aria-label="Message Jubber" placeholder="Message Jubber…" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>
  </dialog>
  <script src="jubber.js"></script>
</body>
</html>
